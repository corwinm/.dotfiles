# AeroSpace experiment: Hyper launches apps and enters task-specific modes.
# Hyper means cmd+alt+ctrl+shift, emitted by the programmable keyboard.
config-version = 2

# Start AeroSpace automatically and reload this file when it changes.
start-at-login = true
auto-reload-config = true

# Run SketchyBar with AeroSpace and tell it when the focused workspace changes.
# SketchyBar ignores this startup command when it is already running.
after-startup-command = ['exec-and-forget sketchybar']
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Use a left-to-right accordion without exposing adjacent windows at the sides.
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
accordion-padding = 0

# Mouse follows focus when the focused monitor changes.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Route newly opened app windows to their task-specific workspaces.
on-window-detected = [
    { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace 1' },
    { if = 'test %{app-bundle-id} = com.mitchellh.ghostty', run = 'move-node-to-workspace 2' },
    { if = 'test %{app-bundle-id} = com.hnc.Discord || test %{app-bundle-id} = com.apple.MobileSMS || test %{app-bundle-id} = com.openai.codex', run = 'move-node-to-workspace 3' },
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap || test %{app-bundle-id} = com.microsoft.Outlook || test %{app-bundle-id} = com.microsoft.teams2', run = 'move-node-to-workspace 6' },
]

# Keep 1–5 on the macOS main display. Put 6–9 on the second display when
# attached, falling back to the main display when only one is available.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']

# Reserve space below SketchyBar's visible capsules on the display that shows
# the bar. The built-in display's notch makes its menu bar taller, so it needs
# a smaller top gap (14) than a notchless external main display (48). Matching
# the built-in display by name keeps it correct whether or not it is 'main'.
# The secondary display has no bar, so it uses the standard 8px outer gap.
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 8
outer.bottom = 8
outer.top = [{ monitor.'built-in' = 14 }, { monitor.main = 48 }, 8]
outer.right = 8

[mode.main.binding]
# App launch/focus shortcuts.
cmd-alt-ctrl-shift-t = 'exec-and-forget open -a "Ghostty"'
cmd-alt-ctrl-shift-b = 'exec-and-forget open -a "Google Chrome"'
cmd-alt-ctrl-shift-d = 'exec-and-forget open -a "Discord"'
cmd-alt-ctrl-shift-m = 'exec-and-forget open -a "Messages"'
cmd-alt-ctrl-shift-v = 'exec-and-forget open -a "Visual Studio Code"'
cmd-alt-ctrl-shift-s = 'exec-and-forget open -a "System Settings"'
cmd-alt-ctrl-shift-p = 'exec-and-forget open -a "Bitwarden"'
cmd-alt-ctrl-shift-f = 'exec-and-forget open -a "Finder"'
cmd-alt-ctrl-shift-r = 'exec-and-forget open -a "Preview"'

# Focus Ghostty on the terminal workspace before opening the coding-agent
# chooser in its most recently active attached tmux client. The upstream
# launcher handles the GUI locale and client selection. Hyper+Q filters to
# agents waiting on us.
cmd-alt-ctrl-shift-g = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-popup.sh --menu"'
cmd-alt-ctrl-shift-q = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-popup.sh --menu --waiting"'

# Work apps. These bindings are harmless when the apps are not installed.
cmd-alt-ctrl-shift-l = 'exec-and-forget open -a "Slack"'
cmd-alt-ctrl-shift-o = 'exec-and-forget open -a "Microsoft Outlook"'
cmd-alt-ctrl-shift-c = 'exec-and-forget open -a "Microsoft Teams"'

# Enter temporary modes so agent and window commands do not consume more
# global Hyper keys.
cmd-alt-ctrl-shift-a = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=agent',
    'mode agent',
]
cmd-alt-ctrl-shift-w = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=window',
    'mode window',
]

# Fast workspace switching.
cmd-alt-ctrl-shift-1 = 'workspace 1'
cmd-alt-ctrl-shift-2 = 'workspace 2'
cmd-alt-ctrl-shift-3 = 'workspace 3'
cmd-alt-ctrl-shift-4 = 'workspace 4'
cmd-alt-ctrl-shift-5 = 'workspace 5'
cmd-alt-ctrl-shift-6 = 'workspace 6'
cmd-alt-ctrl-shift-7 = 'workspace 7'
cmd-alt-ctrl-shift-8 = 'workspace 8'
cmd-alt-ctrl-shift-9 = 'workspace 9'

# Press Hyper+A, then use a number to hot-switch to that one-based agent pane.
# The mode remains active for repeated switching until Escape is pressed.
[mode.agent.binding]
esc = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
    'mode main',
]

c = 'exec-and-forget open -a "ChatGPT"'

1 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 1"'
2 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 2"'
3 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 3"'
4 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 4"'
5 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 5"'
6 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 6"'
7 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 7"'
8 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 8"'
9 = 'exec-and-forget /bin/bash -lc "CODING_AGENTS_TMUX_FOCUS_COMMAND=\"open -a Ghostty\" exec $HOME/.tmux/plugins/coding-agents-tmux/integrations/external/focus-and-switch-index.sh 9"'

# Press Hyper+W, use as many commands as needed, then Escape.
[mode.window.binding]
esc = [
    'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main',
    'mode main',
]

h = 'focus left'
j = 'focus down'
k = 'focus up'
l = 'focus right'

shift-h = 'move left'
shift-j = 'move down'
shift-k = 'move up'
shift-l = 'move right'

ctrl-h = 'join-with left'
ctrl-j = 'join-with down'
ctrl-k = 'join-with up'
ctrl-l = 'join-with right'

minus = 'resize smart -50'
equal = 'resize smart +50'
slash = 'layout --root tiles horizontal vertical'
comma = 'layout --root accordion horizontal vertical'
f = 'layout floating tiling'
r = 'flatten-workspace-tree'
tab = 'workspace-back-and-forth'

1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
6 = 'workspace 6'
7 = 'workspace 7'
8 = 'workspace 8'
9 = 'workspace 9'

shift-1 = ['move-node-to-workspace 1', 'workspace 1']
shift-2 = ['move-node-to-workspace 2', 'workspace 2']
shift-3 = ['move-node-to-workspace 3', 'workspace 3']
shift-4 = ['move-node-to-workspace 4', 'workspace 4']
shift-5 = ['move-node-to-workspace 5', 'workspace 5']
shift-6 = ['move-node-to-workspace 6', 'workspace 6']
shift-7 = ['move-node-to-workspace 7', 'workspace 7']
shift-8 = ['move-node-to-workspace 8', 'workspace 8']
shift-9 = ['move-node-to-workspace 9', 'workspace 9']
