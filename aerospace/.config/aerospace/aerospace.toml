# AeroSpace experiment: Hyper launches apps and Hyper+W enters window mode.
# Hyper means cmd+alt+ctrl+shift, emitted by the programmable keyboard.
config-version = 2

# Start AeroSpace automatically and reload this file when it changes.
start-at-login = true
auto-reload-config = true

# Use a left-to-right accordion without exposing adjacent windows at the sides.
default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'
accordion-padding = 0

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Keep 1–5 on the macOS main display. Put 6–9 on the second display when
# attached, falling back to the main display when only one is available.
[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = ['secondary', 'main']
7 = ['secondary', 'main']
8 = ['secondary', 'main']
9 = ['secondary', 'main']

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]
# Raycast-style app launch/focus shortcuts.
cmd-alt-ctrl-shift-t = 'exec-and-forget open -a "Ghostty"'
cmd-alt-ctrl-shift-b = 'exec-and-forget open -a "Google Chrome"'
cmd-alt-ctrl-shift-d = 'exec-and-forget open -a "Discord"'
cmd-alt-ctrl-shift-m = 'exec-and-forget open -a "Messages"'
cmd-alt-ctrl-shift-v = 'exec-and-forget open -a "Visual Studio Code"'
cmd-alt-ctrl-shift-a = 'exec-and-forget open -a "ChatGPT"'

# Work apps. These bindings are harmless when the apps are not installed.
cmd-alt-ctrl-shift-s = 'exec-and-forget open -a "Slack"'
cmd-alt-ctrl-shift-o = 'exec-and-forget open -a "Microsoft Outlook"'
cmd-alt-ctrl-shift-c = 'exec-and-forget open -a "Microsoft Teams"'

# Enter a temporary mode so window management does not consume more Hyper keys.
cmd-alt-ctrl-shift-w = 'mode window'

# Fast workspace switching.
cmd-alt-ctrl-shift-1 = 'workspace 1'
cmd-alt-ctrl-shift-2 = 'workspace 2'
cmd-alt-ctrl-shift-3 = 'workspace 3'
cmd-alt-ctrl-shift-4 = 'workspace 4'
cmd-alt-ctrl-shift-5 = 'workspace 5'
cmd-alt-ctrl-shift-6 = 'workspace 6'
cmd-alt-ctrl-shift-7 = 'workspace 7'
cmd-alt-ctrl-shift-8 = 'workspace 8'
cmd-alt-ctrl-shift-9 = 'workspace 9'

# Press Hyper+W, use as many commands as needed, then Escape.
[mode.window.binding]
esc = 'mode main'

h = 'focus left'
j = 'focus down'
k = 'focus up'
l = 'focus right'

shift-h = 'move left'
shift-j = 'move down'
shift-k = 'move up'
shift-l = 'move right'

minus = 'resize smart -50'
equal = 'resize smart +50'
slash = 'layout tiles horizontal vertical'
comma = 'layout accordion horizontal vertical'
f = 'layout floating tiling'
r = 'flatten-workspace-tree'
tab = 'workspace-back-and-forth'

1 = 'workspace 1'
2 = 'workspace 2'
3 = 'workspace 3'
4 = 'workspace 4'
5 = 'workspace 5'
6 = 'workspace 6'
7 = 'workspace 7'
8 = 'workspace 8'
9 = 'workspace 9'

shift-1 = ['move-node-to-workspace 1', 'workspace 1']
shift-2 = ['move-node-to-workspace 2', 'workspace 2']
shift-3 = ['move-node-to-workspace 3', 'workspace 3']
shift-4 = ['move-node-to-workspace 4', 'workspace 4']
shift-5 = ['move-node-to-workspace 5', 'workspace 5']
shift-6 = ['move-node-to-workspace 6', 'workspace 6']
shift-7 = ['move-node-to-workspace 7', 'workspace 7']
shift-8 = ['move-node-to-workspace 8', 'workspace 8']
shift-9 = ['move-node-to-workspace 9', 'workspace 9']
